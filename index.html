<!doctype html>

  <meta name="theme-color" content="#0b1116" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>

      font-family: 'VT323';

<body>
  <canvas id="c"></canvas>

    <div class="fx fx-frost"></div>
    <div class="fx fx-cold"></div>
    <div class="fx fx-hurt"></div>

    <div class="fx fx-white"></div>
    <div class="fx fx-dark"></div>
    <div class="fx fx-flash"></div>
  </div>
  <div id="hud" hidden></div>
  <div id="joy" hidden><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="screen"></div>
  <div id="sheet"></div>
  <div id="dialog"></div>
  <div id="card"></div>
  <div id="busy"></div>
  <div id="toasts"></div>
  <div id="boot">
